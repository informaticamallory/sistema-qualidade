<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/M.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de Inspeção de Qualidade" />
    <title>System Tech - Sistema de Inspeção</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Mallory UI Kit — tipografia.
      Sora (títulos e KPIs), Inter (corpo, rótulos e botões) e IBM Plex Mono
      (números, códigos e datas). Os três stacks já estavam declarados em
      styles/tokens.css, mas só a Sora era carregada: Inter estava comentada e
      a IBM Plex Mono ausente, então o sistema caía nos fallbacks Segoe UI e
      Consolas.

      Pesos escolhidos pelo uso real do projeto (400, 500, 600, 700 e 800) —
      carregar de menos faria o navegador sintetizar os faltantes, o que
      engorda e distorce o traço. Uma única requisição para as três famílias.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
